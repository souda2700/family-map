<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Map</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
</head>
<body>
  <header>
    <h1>🗺️ Family Map</h1>
  </header>

  <main>
    <!-- 入力フォーム -->
    <section class="form-container">
      <h2>新しいスポットを登録</h2>
      <form id="spot-form">
        
        <!-- 地域選択 -->
        <div class="form-group">
          <label for="region">地域 <span class="required">*</span></label>
          <select id="region" required>
            <option value="">地域を選択してください</option>
            <option value="北海道">北海道</option>
            <option value="東北">東北</option>
            <option value="関東">関東</option>
            <option value="甲信越・北陸">甲信越・北陸</option>
            <option value="東海">東海</option>
            <option value="関西">関西</option>
            <option value="中国">中国</option>
            <option value="四国">四国</option>
            <option value="九州・沖縄">九州・沖縄</option>
          </select>
        </div>

        <!-- 都道府県選択 -->
        <div class="form-group">
          <label for="pref">都道府県 <span class="required">*</span></label>
          <select id="pref" required>
            <option value="">先に地域を選択してください</option>
          </select>
        </div>

        <!-- スポット名 -->
        <div class="form-group">
          <label for="spot-name">スポット名 <span class="required">*</span></label>
          <input type="text" id="spot-name" placeholder="例: 東京タワー" required>
        </div>

        <!-- 目的 / カテゴリ（複数選択対応） -->
        <div class="form-group">
          <label>目的・ジャンル（複数選択可）</label>
          <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" name="category" value="観光・絶景"> 観光・絶景</label>
            <label class="checkbox-label"><input type="checkbox" name="category" value="グルメ・カフェ"> グルメ・カフェ</label>
            <label class="checkbox-label"><input type="checkbox" name="category" value="温泉・宿泊"> 温泉・宿泊</label>
            <label class="checkbox-label"><input type="checkbox" name="category" value="ショッピング"> ショッピング</label>
            <label class="checkbox-label"><input type="checkbox" name="category" value="体験・アクティビティ"> 体験・アクティビティ</label>
            <label class="checkbox-label"><input type="checkbox" name="category" value="歴史・神社仏閣"> 歴史・神社仏閣</label>
            <label class="checkbox-label"><input type="checkbox" name="category" value="公園・テーマパーク"> 公園・テーマパーク</label>
            <label class="checkbox-label"><input type="checkbox" name="category" value="その他"> その他</label>
          </div>
        </div>

        <!-- 訪問日 -->
        <div class="form-group">
          <label for="visit-date">訪問日</label>
          <input type="date" id="visit-date">
        </div>

        <!-- 星評価 -->
        <div class="form-group">
          <label for="rating">おすすめ度（星評価）</label>
          <select id="rating">
            <option value="5">★★★★★ (大満足)</option>
            <option value="4">★★★★☆ (満足)</option>
            <option value="3" selected>★★★☆☆ (普通)</option>
            <option value="2">★★☆☆☆ (いまいち)</option>
            <option value="1">★☆☆☆☆ (おすすめしない)</option>
          </select>
        </div>

        <!-- Googleマップリンク -->
        <div class="form-group">
          <label for="map-link">Googleマップリンク (URL)</label>
          <input type="url" id="map-link" placeholder="https://maps.app.goo.gl/...">
        </div>

        <!-- メモ -->
        <div class="form-group">
          <label for="spot-memo">メモ</label>
          <textarea id="spot-memo" rows="3" placeholder="感想や注意点など"></textarea>
        </div>

        <button type="submit" id="save-btn">スポットを保存</button>
      </form>
    </section>

    <!-- スポット一覧・条件絞り込み検索 -->
    <section class="list-container">
      <h2>登録したスポット一覧</h2>
      
      <!-- 🔍 条件絞り込みエリア -->
      <div class="filter-box">
        <p class="filter-title">🔍 スポットを絞り込む</p>

        <div class="filter-grid">
          <div class="form-group">
            <label for="search-region">地域で選ぶ</label>
            <select id="search-region">
              <option value="">すべての地域</option>
              <option value="北海道">北海道</option>
              <option value="東北">東北</option>
              <option value="関東">関東</option>
              <option value="甲信越・北陸">甲信越・北陸</option>
              <option value="東海">東海</option>
              <option value="関西">関西</option>
              <option value="中国">中国</option>
              <option value="四国">四国</option>
              <option value="九州・沖縄">九州・沖縄</option>
            </select>
          </div>

          <div class="form-group">
            <label for="search-pref">都道府県で選ぶ</label>
            <select id="search-pref">
              <option value="">すべての都道府県</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="search-category">目的で選ぶ</label>
          <select id="search-category">
            <option value="">すべての目的</option>
            <option value="観光・絶景">観光・絶景</option>
            <option value="グルメ・カフェ">グルメ・カフェ</option>
            <option value="温泉・宿泊">温泉・宿泊</option>
            <option value="ショッピング">ショッピング</option>
            <option value="体験・アクティビティ">体験・アクティビティ</option>
            <option value="歴史・神社仏閣">歴史・神社仏閣</option>
            <option value="公園・テーマパーク">公園・テーマパーク</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="search-input">フリーワード検索（名前・メモ等）</label>
          <input type="text" id="search-input" placeholder="キーワードを入力...">
        </div>

        <button type="button" id="geo-sort-btn" class="btn-geo">📍 現在地から近い順に並び替え</button>
        <button type="button" id="clear-filter-btn">絞り込みをクリア</button>
      </div>

      <div id="spot-list">
        <!-- JavaScriptでカードを追加 -->
      </div>
    </section>

    <!-- 💾 バックアップ・復元エリア -->
    <section class="form-container">
      <h2>データ管理（バックアップ・復元）</h2>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button type="button" id="export-btn" style="flex: 1; padding: 10px; background-color: #2b6cb0; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">データを保存 (出力)</button>
        <button type="button" id="import-trigger-btn" style="flex: 1; padding: 10px; background-color: #4a5568; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">データを復元 (取込)</button>
      </div>
    </section>

    <!-- 🔄 復元用テキスト入力画面 -->
    <div id="import-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
      <div style="background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <h3 style="margin-top: 0;">📋 バックアップデータの復元</h3>
        <p style="font-size: 0.9rem; color: #555;">保存したファイルの中身（テキスト）をコピーして、下の枠内に貼り付けてください。</p>
        <textarea id="import-text-input" rows="8" placeholder="ここにテキストを貼り付け" style="width: 100%; box-sizing: border-box; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 0.85rem;"></textarea>
        <div style="display: flex; gap: 10px;">
          <button type="button" id="import-execute-btn" style="flex: 1; padding: 10px; background-color: #2b6cb0; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">復元を実行</button>
          <button type="button" id="import-cancel-btn" style="flex: 1; padding: 10px; background-color: #718096; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">キャンセル</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
